# Minimal config to fine-tune Kyutai streaming STT 1B on Chinese timestamped ASR data.
#
# Usage:
#   cd moshi-finetune
#   uv run torchrun --nproc-per-node 1 -m train example/stt_zh_lora.yaml
#
# Data format:
#   - train_data: JSONL lines: {"path": "...wav", "duration": 12.34}
#   - sidecar JSON per wav: {"alignments": [["你",[0.12,0.18],"SPEAKER_MAIN"], ...]}

data:
  # TODO: set to your dataset manifest (jsonl).
  train_data: "../data/stt_zh/train.jsonl"
  eval_data: ""
  shuffle: true

moshi_paths:
  hf_repo_id: "kyutai/stt-1b-en_fr-candle"

# Interleaving / alignment options
interleaver:
  # DSM has a fixed delay. Keep 0.0 for the first run, then tune using small eval set.
  # Negative => shift text later (text behind audio). Candidate magnitude ~ asr_delay_in_tokens / mimi.frame_rate.
  audio_delay_sec: 0.0
  downmix_to_mono: true
  keep_main_only: true
  main_speaker_label: "SPEAKER_MAIN"

run_dir: "../runs/stt_zh_lora_run1"

full_finetuning: false
lora:
  enable: true
  rank: 64
  scaling: 2.
  ft_embed: false

# Start small and iterate after the pipeline runs end-to-end.
duration_sec: 20
batch_size: 2
max_steps: 2000

gradient_checkpointing: true
optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 1
do_eval: false
do_ckpt: true
ckpt_freq: 100

# Recommended for easiest inference: save merged weights (not adapters only).
save_adapters: false
